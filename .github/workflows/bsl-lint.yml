name: BSL Language Server Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Run BSL Language Server
        run: |
          LATEST_URL=$(curl -s https://github.com | grep "browser_download_url.*exec.jar" | cut -d '"' -f 4)
          curl -L "$LATEST_URL" -o bsl-language-server.jar
          java -jar bsl-language-server.jar --analyze --src-dir ./src --reporter console
