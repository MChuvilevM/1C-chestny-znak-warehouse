name: BSL Language Server Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Run BSL Language Server
        run: |
          curl -fL "https://github.com" -o bsl-ls.jar
          java -jar bsl-ls.jar --analyze --src-dir ./src --reporter console
